<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Qualifying Leaderboard</title>
    <style>
        :root {
            --bg: #0b1220; --panel: #0f172a; --line: #1e293b; --line2: #24314a;
            --fg: #e2e8f0; --muted: #94a3b8; --dim: #64748b;
            --accent: #38bdf8; --gold: #fbbf24; --good: #22c55e; --warn: #eab308; --bad: #ef4444;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--fg);
               font-family: 'Segoe UI', 'Noto Sans JP', system-ui, sans-serif; padding: 14px; }
        header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
        h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
        .sub { color: var(--muted); font-size: 13px; }
        .badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); }

        table { width: auto; max-width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
        thead th { position: sticky; top: 0; background: var(--panel); color: var(--muted);
                   font-size: 11px; text-transform: uppercase; letter-spacing: .4px;
                   text-align: right; padding: 8px 7px; border-bottom: 2px solid var(--line2); white-space: nowrap; }
        thead th.l { text-align: left; }
        tbody td { padding: 9px 7px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
        tbody td.l { text-align: left; }
        tbody tr:hover td { background: rgba(56,189,248,.05); }
        /* Pilot names get a little breathing room but never stretch the table. */
        .pilotcol { min-width: 90px; }

        .rank { font-weight: 700; font-size: 16px; width: 44px; }
        .rank.p1 { color: var(--gold); } .rank.p2 { color: #cbd5e1; } .rank.p3 { color: #d19a66; }
        .pilot { font-weight: 600; font-size: 15px; }
        .laps { font-size: 18px; font-weight: 800; color: var(--accent); }
        .big  { font-size: 15px; font-weight: 600; }
        .muted { color: var(--muted); }
        .empty { color: var(--dim); padding: 40px; text-align: center; font-size: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>QUALIFYING&nbsp;<span class="muted">90s</span></h1>
        <span id="eventname" class="sub"></span>
        <span id="races" class="badge"></span>
    </header>

    <table>
        <thead>
            <tr>
                <th class="l">#</th>
                <th class="l pilotcol">Pilot</th>
                <th>LAPS</th>
                <th>TIME</th>
                <th>AVGLAP</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">Waiting for Time Trial results…</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const rowsEl = document.getElementById('rows');
        const emptyEl = document.getElementById('empty');
        const eventNameEl = document.getElementById('eventname');
        const racesEl = document.getElementById('races');
        let dp = 3;

        // Always M:SS.mmm (e.g. 0:12.383). Used for the total time.
        function fmtMS(sec) {
            if (sec == null || !isFinite(sec)) return '—';
            const m = Math.floor(sec / 60);
            const s = sec - m * 60;
            return m + ':' + s.toFixed(dp).padStart(dp > 0 ? dp + 3 : 2, '0');
        }
        // M:SS.mmm once the value reaches a minute; plain seconds below that.
        function fmt(sec) {
            if (sec == null || !isFinite(sec)) return '—';
            if (sec >= 60) return fmtMS(sec);
            return sec.toFixed(dp);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function render(data) {
            if (!data || !data.ranking) return;
            if (typeof data.decimalPlaces === 'number') dp = data.decimalPlaces;

            eventNameEl.textContent = data.title || '';
            racesEl.textContent = (data.raceCount != null)
                ? `${data.raceCount} Time Trial race${data.raceCount === 1 ? '' : 's'}`
                : '';

            const ranking = data.ranking;
            emptyEl.style.display = ranking.length ? 'none' : 'block';

            rowsEl.innerHTML = ranking.map((p, i) => {
                const rank = i + 1;
                const rankCls = rank === 1 ? 'p1' : rank === 2 ? 'p2' : rank === 3 ? 'p3' : '';
                const avg = (p.time && p.count) ? p.time / p.count : null;
                return `
                <tr>
                    <td class="l rank ${rankCls}">${rank}</td>
                    <td class="l pilot">${escapeHtml(p.pilotName)}</td>
                    <td><span class="laps">${p.count}</span></td>
                    <td class="big">${fmtMS(p.time)}</td>
                    <td class="muted">${fmt(avg)}</td>
                </tr>`;
            }).join('');
        }

        function update() {
            fetch('/api/leaderboard')
                .then(res => res.json())
                .then(render)
                .catch(err => console.error('Fetch error:', err));
        }

        // Live push whenever FPVTrackside writes a lap time; poll as a fallback.
        const socket = io();
        socket.on('leaderboard_update', render);

        update();
        setInterval(update, 5000);
    </script>
</body>
</html>
